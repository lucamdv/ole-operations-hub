name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare diagnostics
        run: mkdir -p quality-logs

      - name: Install dependencies
        run: |
          npm ci > quality-logs/install.log 2>&1 || { tail -n 80 quality-logs/install.log; exit 1; }

      - name: Architecture tests
        run: |
          npm run test:static > quality-logs/static.log 2>&1 || { tail -n 90 quality-logs/static.log; exit 1; }

      - name: TypeScript
        run: |
          npm run typecheck > quality-logs/typecheck.log 2>&1 || { cat quality-logs/typecheck.log; exit 1; }

      - name: ESLint
        run: |
          npm run lint > quality-logs/lint.log 2>&1 || { tail -n 90 quality-logs/lint.log; exit 1; }

      - name: Production build
        env:
          # Vite SSR requires >2 GiB on Node 22; CI defaults to a 2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          npm run build > quality-logs/build.log 2>&1 || { tail -n 95 quality-logs/build.log; exit 1; }

      - name: Dependency audit
        run: |
          npm audit --audit-level=high > quality-logs/audit.log 2>&1 || { tail -n 95 quality-logs/audit.log; exit 1; }

      - name: Preserve quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-logs
          path: quality-logs/
          retention-days: 3
          if-no-files-found: warn

  smoke:
    name: Production smoke tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Non-destructive production smoke tests
        env:
          SMOKE_BASE_URL: https://olexcockpit.vercel.app
        run: npm run test:smoke
